# Continuous integration: runs on every push to master and on every pull request.
#
# Jobs:
#   * check     - formatting, lints (Clippy pedantic) and all tests on Windows;
#   * msrv      - the crate still builds with the minimum supported Rust version;
#   * deny      - dependency audit (security advisories, licenses, sources);
#   * installer - builds the installer and tests both installation modes.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Format, lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked

      - name: Run tests
        run: cargo test --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the MSRV toolchain declared in Cargo.toml
        run: |
          $msrv = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].rust_version
          rustup toolchain install $msrv --profile minimal
          "MSRV=$msrv" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the crate with the MSRV
        run: cargo "+$env:MSRV" check --all-targets --locked

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  installer:
    name: Build and test the installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the release executable
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: ./scripts/install-inno-setup.ps1

      - name: Build the installer and the portable archive
        run: |
          $version = "$(./scripts/get-version.ps1)-ci.$env:GITHUB_RUN_NUMBER"
          ./scripts/build-installer.ps1 -Version $version
          ./scripts/package-portable.ps1 -Version $version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test the per-user installation
        run: ./scripts/test-installer.ps1 -Installer "dist/DiscordPresenceStatus-$env:VERSION-setup-x64.exe" -Scope CurrentUser

      - name: Test the machine-wide installation
        run: ./scripts/test-installer.ps1 -Installer "dist/DiscordPresenceStatus-$env:VERSION-setup-x64.exe" -Scope AllUsers

      - name: Upload the test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-presence-status-${{ env.VERSION }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
