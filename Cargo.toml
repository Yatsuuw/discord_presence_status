[package]
name = "discord_presence_status"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
description = "A lightweight desktop application to display custom Discord Rich Presence activities."
license-file = "LICENSE"
repository = "https://github.com/Yatsuuw/discord_presence_status"
readme = "README.md"
keywords = ["discord", "rich-presence", "status", "desktop", "windows"]
categories = ["gui"]
publish = false

[[bin]]
name = "discord_presence_status"
path = "src/main.rs"

[dependencies]
discord-rich-presence = "1.1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
egui_extras = { version = "0.37", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tray-icon = { version = "0.26", default-features = false }

# Message loop of the tray icon while no window is open and Alt codes (two
# documented `unsafe` functions: wait_for_tray_message, install_alt_code_hook).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
# Hook into the Windows message loop to support Alt codes (src/ui/keyboard/).
winit = { version = "0.30", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[lints.rust]
missing_docs = "warn"
# Denied everywhere; two small, documented functions are allowed to use it.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The `ui` module exposes types such as `UiAction` on purpose.
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
